plugins {
    id 'dev.architectury.loom'
    id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "roadweaver_rpg.mixins.json"
    }
    // 添加 Mixin refmap 配置
    mixin {
        defaultRefmapName = "roadweaver_rpg.refmap.json"
    }
}

configurations {
    common
    shadowCommon // 用于打包 common 模块
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven {
        url = "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        name "Modrinth Maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.blamejared.com"
        name "BlameJared Maven"
    }
    maven {
        url = "https://www.cursemaven.com"
        name "CurseMaven"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.kosmx.dev/"
        name "KosmX's Maven"
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    // Common 模块
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive false }
    
    // Forge 平台
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    
    // 森罗物语依赖
    modImplementation "maven.modrinth:kaleidoscope-cookery:${rootProject.kaleidoscope_cookery_forge_version}"
    
    // Touhou Little Maid 依赖
    modImplementation "maven.modrinth:touhou-little-maid:${rootProject.touhou_little_maid_version}"

    // Cloth Config API - 使用 Shedaniel Maven 的官方版本并打包到模组中
    modApi("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    include("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    
    // 魔法模组兼容依赖（编译时依赖）
    modCompileOnly("maven.modrinth:irons-spells-n-spellbooks:1.20.1-3.15.0")
    modCompileOnly("maven.modrinth:ars-nouveau:4.12.6-forge,1.20.1")
    modCompileOnly("maven.modrinth:goety:2.5.37.0-forge,1.20.1")
    
    // 开发环境运行时依赖 - 完全参考 Touhou-Little-Maid-Spell 配置
    // 使用与参考项目相同的依赖源（MR 或 CF）
    //modImplementation("maven.modrinth:caelus:3.2.0+1.20.1-forge")
    //modImplementation("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")
    //modImplementation("maven.modrinth:geckolib:4.8.2")
    modImplementation("maven.modrinth:curios:5.14.1+1.20.1-forge")
    
    // Iron's Spells & Spellbooks - 使用 CurseForge 版本
    //modImplementation("maven.modrinth:irons-spells-n-spellbooks:1.20.1-3.4.0.9")
    
    // Ars Nouveau 及其依赖（可选）
    //modRuntimeOnly("maven.modrinth:ars-nouveau:4.12.6-forge,1.20.1")
    //modRuntimeOnly("maven.modrinth:patchouli:1.20.1-84.1-forge")
    
    // Goety-2（可选）
    //modRuntimeOnly("maven.modrinth:goety:2.5.37.0-forge,1.20.1")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: rootProject.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'roadweaver_rpg',
        mod_name: 'RoadWeaver RPG',
        mod_version: project.version,
        mod_authors: 'shiroha233',
        mod_description: 'RPG gameplay expansion for RoadWeaver - adds adventure elements to road networks.'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// Shadow JAR 配置 - 打包 common 模块
shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

jar {
    archiveClassifier.set("dev")
}

// 构建完成后复制到本地mods文件夹
tasks.register('copyToMods') {
    dependsOn remapJar
    doLast {
        def modsDir = new File("C:/MC/versions/1.20.1-Forge-tese/mods")
        if (!modsDir.exists()) {
            modsDir.mkdirs()
        }
        copy {
            from remapJar.archiveFile
            into modsDir
        }
        println "✓ 模组已复制到: ${modsDir.absolutePath}"
    }
}

build.finalizedBy copyToMods

// Source JAR 组装（合并 common 源码）
sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

java {
    withSourcesJar()
}
